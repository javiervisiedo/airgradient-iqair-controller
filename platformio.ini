; atoms3-iaq-matter-controller: M5Stack AtomS3 Lite (ESP32-S3FN8, 8 MB flash, no PSRAM)
; Requirements: docs/main_requirement_spec.md, docs/automated_iaq_multigas_fan_controller_spec_v3.md
;
; Arduino-ESP32 core 3.3.12 (ESP-IDF 5.5.5, Matter) via the pioarduino platform.
; The official PlatformIO espressif32 platform does not ship Arduino core 3.x.
; pioarduino needs Python >= 3.10 for PlatformIO's own environment.

[platformio]
default_envs = atoms3

[env]
build_flags =
    -DARDUINOJSON_POOL_CAPACITY=64     ; small ArduinoJson pools so JSON fits the static arenas
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[env:atoms3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-atoms3
framework = arduino
board_build.partitions = partitions_8MB_matter.csv
board_build.filesystem = littlefs
board_upload.flash_size = 8MB
board_upload.arduino.boot_app0 = 0x19000  ; must match otadata offset in partitions_8MB_matter.csv (not default 0xe000 inside nvs!)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1        ; Serial over native USB (GPIO19/20)
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3               ; info
    -DIAQ_MATTER_AIR_PURIFIER_TYPE=1   ; also advertise device type 0x002D on the fan endpoint
; all tests in test/ are host-only
test_ignore = *

[env:atoms3_debug]
extends = env:atoms3
build_type = debug
build_flags =
    ${env:atoms3.build_flags}
    -DCORE_DEBUG_LEVEL=5

[env:atoms3_sim]
extends = env:atoms3
build_flags =
    ${env:atoms3.build_flags}
    -DWOKWI_SIM
    -DWIFI_SSID=\"Wokwi-GUEST\"
    -DWIFI_PASSWORD=\"\"

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    ${env.build_flags}
    -std=gnu++17
    -DUNIT_TEST
    -Wall
    -Wextra
    -Wno-missing-field-initializers
; only the hardware-independent parts of each module are built on the host
build_src_filter =
    -<*>
    +<iaq_algorithm.cpp>
    +<sys_config.cpp>
    +<ir_nec_purifier.cpp>
    +<status_led.cpp>
    +<clock_sync.cpp>
    +<ag_client.cpp>
    +<api_auth.cpp>
    +<matter_ha_bridge.cpp>
    +<sim_inject.cpp>
